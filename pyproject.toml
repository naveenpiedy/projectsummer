[project]
name = "projectsummer"
version = "2.0.0.dev0"
description = "Query, analyse and explore your Letterboxd data from a CLI or an LLM agent."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "beautifulsoup4>=4.15.0",
    "duckdb>=1.1",
    "pydantic>=2.13.5",
    "python-dotenv>=1.0",
    "requests>=2.34.2",
    "typer>=0.27.2",
]

[project.scripts]
summer = "projectsummer.cli:main"

[project.optional-dependencies]
mcp = [
    "fastmcp>=4,<5",
]
sync = [
    "tqdm>=4.66",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/projectsummer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
